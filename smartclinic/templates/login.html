{% extends "base.html" %}
{% block public %}
<div class="login"><div class="panel">
  <h1>SmartClinic<span style="color:var(--brand)">+</span></h1>
  <p class="sub">Sign in to book, treat and coordinate care.</p>
  {% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <p><button style="width:100%">Sign in</button></p>
  </form>
</div></div>
{% endblock %}
